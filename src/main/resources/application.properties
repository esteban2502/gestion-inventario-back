spring.application.name=gestion-productos
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

app.password-reset.expiration-minutes=60
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:4200}

# --- Bootstrap del primer administrador (opcional) ---
# Lee los valores desde variables de entorno o desde .env (cargado al inicio con DotEnvLoader).
#
# ADMIN_BOOTSTRAP_EMAIL + ADMIN_BOOTSTRAP_PASSWORD (ambos rellenos):
#   Al arrancar, si ese email NO existe, crea un usuario ADMIN con esa contrasena (BCrypt).
#
# ADMIN_BOOTSTRAP_PROMOTE_SELLER=true:
#   Si el email del bootstrap YA existe como SELLER, lo sube a ADMIN y aplica ADMIN_BOOTSTRAP_PASSWORD.
#   Usar con cuidado; en produccion suele ser false.
#
# Si dejas email o contrasena vacios, no se ejecuta ninguna accion de bootstrap.
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap-promote-seller=${ADMIN_BOOTSTRAP_PROMOTE_SELLER:false}

# Gmail/Outlook SMTP: usa tu correo personal, sin registrarte en servicios externos (Brevo, Resend, etc.)
# Gmail: activa verificacion en 2 pasos y crea una "Contrasena de aplicacion" en tu cuenta Google
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

